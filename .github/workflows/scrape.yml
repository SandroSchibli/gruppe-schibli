name: Scrape SRF Tippspiel

on:
  # Run every 30 minutes during match hours (17:00–23:30 UTC = 19:00–01:30 Swiss time)
  schedule:
    - cron: '0,30 17-23 * * *'
  # Also allow manual trigger from GitHub website
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to commit data.json back to repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browser
        run: playwright install chromium --with-deps

      - name: Run scraper
        env:
          SRF_USERNAME: ${{ secrets.SRF_USERNAME }}
          SRF_PASSWORD: ${{ secrets.SRF_PASSWORD }}
        run: python scrape.py

      - name: Upload debug screenshots (always, even on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: /tmp/*.png
          retention-days: 3

      - name: Commit updated data
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "GitHub Actions"
          git add data/data.json
          git diff --staged --quiet || git commit -m "🔄 Update data $(date -u '+%H:%M UTC')"
          git push
