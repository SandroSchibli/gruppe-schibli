<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gruppe Schibli – WM 2026</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d0d1a">
<link rel="manifest" href="manifest.json">
<style>
:root{
  --bg:#0d0d1a;
  --card:#1a1a2e;
  --card2:#16213e;
  --accent:#e63946;
  --gold:#f4c430;
  --green:#06d6a0;
  --text:#f0f0f0;
  --text2:#888;
  --border:rgba(255,255,255,0.07);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,system-ui,sans-serif;min-height:100vh;max-width:600px;margin:0 auto}

/* ── Header ── */
.header{
  background:linear-gradient(160deg,#0f3460 0%,#16213e 50%,#1a1a2e 100%);
  padding:env(safe-area-inset-top,16px) 16px 16px;
  text-align:center;
  border-bottom:2px solid var(--accent);
  position:relative;
  overflow:hidden;
}
.header::before{
  content:'⚽';
  position:absolute;
  font-size:120px;
  opacity:0.04;
  top:-10px;right:-20px;
}
.wm-badge{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:6px}
.title{font-size:24px;font-weight:900;letter-spacing:-0.5px}
.subtitle{font-size:12px;color:var(--text2);margin-top:2px}

/* ── Standings ── */
.section{padding:14px 16px}
.section-title{font-size:10px;text-transform:uppercase;letter-spacing:2px;color:var(--text2);font-weight:700;margin-bottom:10px}
.s-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border)}
.s-row:last-child{border-bottom:none}
.s-rank{font-size:11px;color:var(--text2);width:18px;flex-shrink:0;font-weight:600}
.s-name{flex:1;font-size:14px;font-weight:700}
.s-bar-wrap{flex:1;height:3px;background:rgba(255,255,255,0.06);border-radius:2px;overflow:hidden}
.s-bar{height:100%;background:linear-gradient(90deg,var(--accent),var(--gold));border-radius:2px;transition:width .6s ease}
.s-pts{font-size:13px;font-weight:700;color:var(--gold);min-width:56px;text-align:right}

/* ── Tabs ── */
.tabs{display:flex;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg);z-index:20;padding:0 12px}
.tab{padding:13px 14px;font-size:13px;font-weight:600;color:var(--text2);border-bottom:2px solid transparent;cursor:pointer;transition:all .2s;flex:1;text-align:center}
.tab.active{color:var(--text);border-bottom-color:var(--accent)}

/* ── Round panel ── */
.round-panel{display:none;padding:12px 16px 24px}
.round-panel.active{display:block}

/* ── Match card ── */
.match-card{background:var(--card);border-radius:14px;margin-bottom:10px;overflow:hidden;border:1px solid var(--border)}
.match-card.is-live{border-color:rgba(6,214,160,0.35);background:rgba(6,214,160,0.02)}

.match-top{padding:10px 14px 0;display:flex;align-items:center;gap:8px}
.live-badge{background:var(--accent);color:#fff;font-size:10px;font-weight:800;padding:2px 7px;border-radius:4px;letter-spacing:0.8px;animation:pulse 1.5s infinite}
.match-time{font-size:11px;color:var(--text2)}
.match-date{font-size:11px;color:var(--text2)}

.match-body{display:flex;align-items:center;justify-content:space-between;padding:10px 14px 12px}
.team{display:flex;flex-direction:column;align-items:center;gap:3px;width:36%}
.flag{font-size:30px;line-height:1}
.tname{font-size:11px;font-weight:600;color:var(--text2);text-align:center;line-height:1.2}
.score-area{display:flex;flex-direction:column;align-items:center;gap:3px}
.score{font-size:28px;font-weight:900;letter-spacing:3px;line-height:1}
.score.live-score{color:var(--green)}
.score.upcoming{font-size:20px;color:var(--text2)}
.cd{font-size:12px;color:var(--green);font-weight:600;font-variant-numeric:tabular-nums}
.final-label{font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--text2)}

/* ── Tips grid ── */
.tips{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--border)}
.tc{padding:9px 14px;border-right:1px solid var(--border);border-bottom:1px solid var(--border)}
.tc:nth-child(2n){border-right:none}
.tc:nth-child(n+3){border-bottom:none}
.tc.scoring{background:rgba(6,214,160,0.07)}
.tcn{font-size:11px;color:var(--text2);font-weight:500;margin-bottom:3px}
.tcr{display:flex;align-items:center;justify-content:space-between}
.tcs{font-size:15px;font-weight:700}
.tcs.exact{color:var(--gold)}
.tcs.correct{color:var(--green)}
.tcs.wrong{color:var(--text2)}
.tcs.open{color:var(--text)}
.tcs.future{color:var(--text2);opacity:0.35}
.tcp{font-size:11px;font-weight:700;padding:2px 5px;border-radius:4px}
.tcp.won{background:rgba(244,196,48,0.15);color:var(--gold)}
.tcp.live{background:rgba(6,214,160,0.2);color:var(--green)}
.tcp.nope{color:var(--text2)}
.tcp.dash{color:var(--text2);opacity:0.4}

/* ── Live sim ── */
.sim{border-top:1px solid var(--border);padding:10px 14px}
.sim-title{font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:var(--text2);font-weight:600;margin-bottom:7px}
.simr{display:flex;align-items:center;gap:8px;padding:3px 0}
.simr-rank{font-size:11px;color:var(--text2);width:14px}
.simr-name{font-size:13px;font-weight:600;flex:1}
.simd{font-size:12px;font-weight:700;padding:1px 5px;border-radius:3px;min-width:32px;text-align:right}
.simd.pos{background:rgba(6,214,160,0.18);color:var(--green)}
.simd.zero{color:var(--text2)}
.simd.nul{color:var(--text2);opacity:0.4}

/* ── Notif bar ── */
.notif{padding:4px 16px 16px}
.notif-btn{display:block;padding:13px;background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:12px;color:var(--text2);font-size:13px;text-align:center;text-decoration:none;cursor:pointer}
.notif-btn:hover{background:rgba(255,255,255,0.08);color:var(--text)}
.updated{padding:4px 16px 32px;font-size:11px;color:var(--text2);text-align:center}

/* ── Main nav tabs ── */
.main-tabs{display:flex;background:var(--card2);border-bottom:2px solid var(--border)}
.main-tab{flex:1;padding:13px 8px;font-size:12px;font-weight:700;color:var(--text2);text-align:center;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .2s}
.main-tab.active{color:var(--text);border-bottom-color:var(--accent)}
.main-view{display:none}
.main-view.active{display:block}

/* ── Top scorers ── */
.scorer-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
.scorer-row:last-child{border-bottom:none}
.scorer-rank{font-size:13px;color:var(--text2);width:20px}
.scorer-flag{font-size:18px}
.scorer-name{flex:1;font-size:14px;font-weight:600}
.scorer-team{font-size:11px;color:var(--text2)}
.scorer-goals{font-size:18px;font-weight:900;color:var(--gold)}

/* ── Group table ── */
.group-block{margin-bottom:20px}
.group-name{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:var(--accent);margin-bottom:8px}
.group-table{width:100%;border-collapse:collapse;font-size:12px}
.group-table th{color:var(--text2);font-weight:600;padding:4px 6px;text-align:right}
.group-table th:first-child{text-align:left}
.group-table td{padding:6px 6px;border-top:1px solid var(--border);text-align:right;font-weight:600}
.group-table td:first-child{text-align:left;font-size:13px}
.group-table .q-advance td{color:var(--green)}
.pts-cell{color:var(--gold)!important;font-weight:900!important}
.rank-badge{display:inline-block;width:16px;height:16px;line-height:16px;text-align:center;border-radius:50%;background:rgba(255,255,255,0.1);font-size:10px;font-weight:700;margin-right:4px;vertical-align:middle}

.empty-state{padding:40px 16px;text-align:center;color:var(--text2);font-size:13px}

@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
</style>
</head>
<body>

<header class="header">
  <div class="wm-badge">⚽ FIFA World Cup 2026</div>
  <div class="title">Gruppe Schibli</div>
  <div class="subtitle">Tippspiel-Tracker</div>
</header>

<div class="section" id="standings-section"></div>

<div class="main-tabs">
  <div class="main-tab active" onclick="switchMain('tipps')">⚽ Tipps</div>
  <div class="main-tab" onclick="switchMain('torjaeger')">👟 Torjäger</div>
  <div class="main-tab" onclick="switchMain('tabelle')">📊 Tabelle</div>
</div>

<div id="view-tipps" class="main-view active">
  <div class="tabs" id="tabs"></div>
  <div id="panels"></div>
</div>

<div id="view-torjaeger" class="main-view" style="padding:16px">
  <div id="top-scorers-section"></div>
</div>

<div id="view-tabelle" class="main-view" style="padding:16px">
  <div id="groups-section"></div>
</div>

<div class="notif">
  <a class="notif-btn" id="notif-link" href="#" target="_blank">🔔 Push-Notifications aktivieren</a>
</div>
<div class="updated" id="updated"></div>

<script>
const MEMBERS = ['Sandro S','Alice B','Karin S','Adi S'];
const FIRST   = {'Sandro S':'Sandro','Alice B':'Alice','Karin S':'Karin','Adi S':'Adi'};
const NTFY    = 'https://ntfy.sh/gruppe-schibli-wm26';

let _countdowns = []; // [{el, kickoff}]
let _data = null;
let _activeTab = -1;

// ── Scoring ──────────────────────────────────────────────────────────
function calcPts(tip, res, isKO) {
  if (!tip || tip.home == null || !res || res.home == null) return null;
  let p = 0;
  const to = tip.home > tip.away ? 1 : tip.home < tip.away ? -1 : 0;
  const ro = res.home  > res.away  ? 1 : res.home  < res.away  ? -1 : 0;
  if (to === ro) p += 5;
  if (tip.home === res.home) p += 1;
  if (tip.away === res.away) p += 1;
  if ((tip.home - tip.away) === (res.home - res.away)) p += 3;
  return isKO ? p * 2 : p;
}

function tipCls(tip, res, isKO) {
  if (!tip || tip.home == null || !res || res.home == null) return 'open';
  const p = calcPts(tip, res, isKO);
  if (p >= 10) return 'exact';
  if (p >= 5)  return 'correct';
  if (p > 0)   return 'correct';
  return 'wrong';
}

// ── Timing helpers ───────────────────────────────────────────────────
function isLive(m) {
  if (m.result && m.result.home != null) return false;
  if (!m.kickoff) return false;
  const now = Date.now(), ko = +new Date(m.kickoff);
  return now >= ko && now < ko + 115 * 60000;
}

function isFuture(m) {
  if (m.result && m.result.home != null) return false;
  return m.kickoff && +new Date(m.kickoff) > Date.now();
}

function fmtDate(iso) {
  if (!iso) return '';
  return new Date(iso).toLocaleString('de-CH', {
    weekday:'short', day:'numeric', month:'short',
    hour:'2-digit', minute:'2-digit', timeZone:'Europe/Zurich'
  });
}

function fmtCd(ms) {
  if (ms <= 0) return null;
  const h = Math.floor(ms / 3600000);
  const m = Math.floor((ms % 3600000) / 60000);
  const s = Math.floor((ms % 60000) / 1000);
  if (h >= 24) return `${Math.floor(h/24)}d ${h%24}h`;
  if (h > 0)   return `${h}h ${String(m).padStart(2,'0')}m`;
  return `${String(m).padStart(2,'0')}m ${String(s).padStart(2,'0')}s`;
}

// ── Match card builder ───────────────────────────────────────────────
function matchCard(m, isKO, roundIdx, gameIdx) {
  const hasRes = m.result && m.result.home != null;
  const live   = isLive(m);
  const future = isFuture(m);
  const ls = m.liveScore || (live ? {home:0, away:0} : null);
  const preds = m.predictions || {};

  // -- Top bar
  let topHtml = '';
  if (live) {
    topHtml = `<span class="live-badge">LIVE</span>`;
    if (ls) topHtml += `<span class="match-time">${ls.home}:${ls.away}</span>`;
  } else if (m.kickoff) {
    topHtml = `<span class="match-date">${fmtDate(m.kickoff)}</span>`;
  }

  // -- Score area
  let scoreHtml = '';
  const cdId = `cd_${roundIdx}_${gameIdx}`;
  if (hasRes) {
    scoreHtml = `<div class="score">${m.result.home}:${m.result.away}</div><div class="final-label">Abpfiff</div>`;
  } else if (live && ls) {
    scoreHtml = `<div class="score live-score">${ls.home}:${ls.away}</div>`;
  } else if (future) {
    scoreHtml = `<div class="score upcoming">–:–</div><div class="cd" id="${cdId}" data-ko="${m.kickoff}">…</div>`;
    // will be populated by countdown ticker
  } else {
    scoreHtml = `<div class="score upcoming">–:–</div>`;
  }

  // -- Tips
  let tipsHtml = '';
  MEMBERS.forEach(mb => {
    const tip = preds[mb] || {};
    const hasTip = tip.home != null && tip.away != null;
    let pts = null, cls, ptBadge;

    if (hasRes) {
      pts = calcPts(tip, m.result, isKO);
      cls = tipCls(tip, m.result, isKO);
      if (pts === null)   ptBadge = `<span class="tcp dash">–</span>`;
      else if (pts > 0)   ptBadge = `<span class="tcp won">+${pts}</span>`;
      else                ptBadge = `<span class="tcp nope">0</span>`;
    } else if (live && ls) {
      pts = calcPts(tip, ls, isKO);
      cls = hasTip ? (pts > 0 ? (pts >= 10 ? 'exact' : 'correct') : 'wrong') : 'future';
      if (hasTip) ptBadge = pts > 0 ? `<span class="tcp live">+${pts}</span>` : `<span class="tcp nope">+0</span>`;
      else        ptBadge = `<span class="tcp dash">–</span>`;
    } else {
      cls = hasTip ? 'open' : 'future';
      ptBadge = hasTip ? `<span class="tcp dash">?</span>` : `<span class="tcp dash">–</span>`;
    }

    const str = hasTip ? `${tip.home}:${tip.away}` : '—';
    const scoring = (live && ls && pts > 0) ? ' scoring' : '';
    tipsHtml += `<div class="tc${scoring}"><div class="tcn">${FIRST[mb]||mb}</div><div class="tcr"><span class="tcs ${cls}">${str}</span>${ptBadge}</div></div>`;
  });

  // -- Live sim ranking
  let simHtml = '';
  if (live && ls && _data) {
    const standings = _data.standings || [];
    const proj = MEMBERS.map(mb => {
      const tip = preds[mb] || {};
      const hasTip = tip.home != null;
      const g = hasTip ? (calcPts(tip, ls, isKO) || 0) : 0;
      const cur = (standings.find(s => s.name === mb) || {}).points || 0;
      return {name: mb, g, hasTip, tot: cur + g};
    }).sort((a,b) => b.tot - a.tot || b.g - a.g);

    simHtml = `<div class="sim"><div class="sim-title">Live Ranking (bei diesem Ergebnis)</div>`;
    proj.forEach((p,i) => {
      const dCls = p.g > 0 ? 'pos' : (p.hasTip ? 'zero' : 'nul');
      const dTxt = p.g > 0 ? `+${p.g}` : (p.hasTip ? '+0' : '–');
      simHtml += `<div class="simr"><span class="simr-rank">${i+1}</span><span class="simr-name">${FIRST[p.name]||p.name}</span><span class="simd ${dCls}">${dTxt}</span></div>`;
    });
    simHtml += `</div>`;
  }

  return `
<div class="match-card${live ? ' is-live' : ''}">
  <div class="match-top">${topHtml}</div>
  <div class="match-body">
    <div class="team"><span class="flag">${m.homeFlag||''}</span><span class="tname">${m.home}</span></div>
    <div class="score-area">${scoreHtml}</div>
    <div class="team"><span class="flag">${m.awayFlag||''}</span><span class="tname">${m.away}</span></div>
  </div>
  <div class="tips">${tipsHtml}</div>
  ${simHtml}
</div>`;
}

// ── Sort: live first → completed newest first → upcoming soonest first ──
function sortMatches(matches) {
  return [...matches].sort((a, b) => {
    const aLive = isLive(a), bLive = isLive(b);
    if (aLive !== bLive) return aLive ? -1 : 1;
    const aFin = a.result?.home != null, bFin = b.result?.home != null;
    if (aFin && bFin) return new Date(b.kickoff) - new Date(a.kickoff); // newest first
    if (!aFin && !bFin) return new Date(a.kickoff) - new Date(b.kickoff); // soonest first
    return aFin ? -1 : 1; // finished above upcoming
  });
}

// ── Render ───────────────────────────────────────────────────────────
function render(DATA) {
  _data = DATA;
  _countdowns = [];

  // Standings
  const maxPts = Math.max(...DATA.standings.map(s=>s.points), 1);
  document.getElementById('standings-section').innerHTML =
    `<div class="section-title">Rangliste</div>` +
    DATA.standings.map(s => `
<div class="s-row">
  <span class="s-rank">#${s.rank}</span>
  <span class="s-name">${s.name}</span>
  <div class="s-bar-wrap"><div class="s-bar" style="width:${(s.points/maxPts*100).toFixed(1)}%"></div></div>
  <span class="s-pts">${s.points} Pkt</span>
</div>`).join('');

  // Decide default active tab: last round with a live game, or most recent with results
  let defaultTab = DATA.rounds.length - 1;
  DATA.rounds.forEach((r,i) => { if (r.matches.some(m => isLive(m))) defaultTab = i; });

  // If no live, default to the last round with any results
  if (!DATA.rounds[defaultTab].matches.some(m => isLive(m))) {
    DATA.rounds.forEach((r,i) => { if (r.matches.some(m => m.result)) defaultTab = i; });
  }

  if (_activeTab < 0) _activeTab = defaultTab;

  // Tabs
  const tabsEl = document.getElementById('tabs');
  tabsEl.innerHTML = DATA.rounds.map((r,i) =>
    `<div class="tab${i===_activeTab?' active':''}" onclick="switchTab(${i})">${r.name}</div>`
  ).join('');

  // Panels — sorted newest first within each round
  document.getElementById('panels').innerHTML = DATA.rounds.map((r,i) => `
<div class="round-panel${i===_activeTab?' active':''}" id="panel-${i}">
  ${sortMatches(r.matches).map((m,j) => matchCard(m, r.isKO||false, i, j)).join('')}
</div>`).join('');

  // Updated
  if (DATA.updated) {
    document.getElementById('updated').textContent =
      'Aktualisiert: ' + new Date(DATA.updated).toLocaleString('de-CH',{timeZone:'Europe/Zurich'});
  }

  // Top scorers + group tables
  renderTopScorers(DATA.top_scorers);
  renderGroups(DATA.groups);

  // Gather countdown elements
  document.querySelectorAll('[data-ko]').forEach(el => {
    _countdowns.push({el, ko: +new Date(el.dataset.ko)});
  });
}

function switchMain(view) {
  document.querySelectorAll('.main-tab').forEach((t,i) => {
    t.classList.toggle('active', ['tipps','torjaeger','tabelle'][i] === view);
  });
  document.querySelectorAll('.main-view').forEach(v => {
    v.classList.toggle('active', v.id === 'view-'+view);
  });
}

function renderTopScorers(scorers) {
  const el = document.getElementById('top-scorers-section');
  if (!scorers || !scorers.length) {
    el.innerHTML = '<div class="empty-state">Torjäger werden geladen sobald der Scraper läuft ⏳</div>';
    return;
  }
  el.innerHTML = '<div class="section-title">Torschützenkönig</div>' +
    scorers.map((s,i) => `
<div class="scorer-row">
  <span class="scorer-rank">#${i+1}</span>
  <span class="scorer-flag">${s.flag||''}</span>
  <div style="flex:1">
    <div class="scorer-name">${s.name}</div>
    <div class="scorer-team">${s.team||''}</div>
  </div>
  <span class="scorer-goals">${s.goals}</span>
</div>`).join('');
}

function renderGroups(groups) {
  const el = document.getElementById('groups-section');
  if (!groups || !groups.length) {
    el.innerHTML = '<div class="empty-state">Gruppentabelle wird berechnet… ⏳</div>';
    return;
  }
  el.innerHTML = groups.map(g => `
<div class="group-block">
  <div class="group-name">${g.name}</div>
  <table class="group-table">
    <tr><th>Team</th><th>Sp</th><th>S</th><th>U</th><th>N</th><th>Tore</th><th>TD</th><th>Pkt</th></tr>
    ${g.teams.map((t,i) => `<tr class="${i<2?'q-advance':''}">
      <td><span class="rank-badge">${t.rank}</span>${t.flag||''} ${t.name}</td>
      <td>${t.played||0}</td><td>${t.won||0}</td><td>${t.drawn||0}</td><td>${t.lost||0}</td>
      <td>${t.gf||0}:${t.ga||0}</td>
      <td>${t.gd>0?'+':''}${t.gd||0}</td>
      <td class="pts-cell">${t.points||0}</td>
    </tr>`).join('')}
  </table>
</div>`).join('');
}

function switchTab(i) {
  _activeTab = i;
  document.querySelectorAll('.tab').forEach((t,j) => t.classList.toggle('active', j===i));
  document.querySelectorAll('.round-panel').forEach((p,j) => p.classList.toggle('active', j===i));
}

// ── Countdown ticker ─────────────────────────────────────────────────
function tickCountdowns() {
  const now = Date.now();
  _countdowns.forEach(({el, ko}) => {
    if (!el.isConnected) return;
    const cd = fmtCd(ko - now);
    el.textContent = cd ? `⏱ ${cd}` : 'Jetzt!';
  });
}

// ── Data loading ─────────────────────────────────────────────────────
let _lastUpdated = '';
async function loadData() {
  const res = await fetch('./data/data.json?t=' + Date.now());
  return res.json();
}

async function refresh() {
  try {
    const data = await loadData();
    if (data.updated !== _lastUpdated) {
      _lastUpdated = data.updated;
      render(data);
    }
  } catch(e) { console.warn('Refresh failed', e); }
}

// ── Init ─────────────────────────────────────────────────────────────
(async () => {
  try {
    const data = await loadData();
    _lastUpdated = data.updated;
    render(data);
  } catch(e) {
    document.getElementById('panels').innerHTML = '<div style="padding:32px;text-align:center;color:var(--text2)">Daten werden geladen…</div>';
    console.error(e);
  }
})();

// ntfy link
document.getElementById('notif-link').href = NTFY;

// Countdown every second
setInterval(tickCountdowns, 1000);

// Data refresh every 60s; faster when live game running
setInterval(() => {
  const hasLive = _data?.rounds?.some(r => r.matches.some(m => isLive(m)));
  if (hasLive) refresh(); // always refresh during live
}, 60000);
setInterval(() => {
  const hasLive = _data?.rounds?.some(r => r.matches.some(m => isLive(m)));
  if (!hasLive) refresh();
}, 5 * 60000);

// Refresh on tab focus
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') refresh();
});

// Service worker
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(() => {});
}
</script>
</body>
